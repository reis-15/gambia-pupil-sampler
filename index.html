<style>
:root{
  --blue:#357ccc; --frost:#83cfdc; --concrete:#c3d2d7; --slate:#52525c; --navy:#2c3242;
  --red:#d61a2e; --green:#95c756; --ink:#000; --paper:#fff;
  --tint:#eef2f3;
  --font:"Poppins",Arial,Helvetica,sans-serif;
}
*{box-sizing:border-box}
html{-webkit-text-size-adjust:100%}
body{margin:0;background:var(--paper);color:var(--ink);font-family:var(--font);font-size:16px;line-height:1.5;
  padding:env(safe-area-inset-top,0) env(safe-area-inset-right,0) env(safe-area-inset-bottom,0) env(safe-area-inset-left,0)}
.wrap{max-width:760px;margin:0 auto;padding:20px 16px 64px}
header.top{border-bottom:2px solid var(--concrete);padding-bottom:14px;margin-bottom:22px}
.brand{font-weight:700;font-size:13px;letter-spacing:.04em;color:var(--navy)}
h1{font-size:26px;line-height:1.2;margin:6px 0 2px;font-weight:700}
.sub{color:var(--slate);margin:0;font-size:14px}
h2{font-size:19px;margin:30px 0 8px;font-weight:600}
h3{font-size:16px;margin:0 0 6px;font-weight:600}
p{margin:0 0 10px}
.muted{color:var(--slate);font-size:14px}
label{display:block;font-weight:500;font-size:14px;margin:12px 0 4px}
input,select{font:inherit;width:100%;min-height:48px;padding:8px 12px;border:1.5px solid var(--slate);border-radius:6px;background:#fff;color:#000}
input[type=checkbox]{width:24px;min-height:24px;height:24px;flex:none;margin:2px 0 0}
input:disabled,select:disabled{background:var(--tint);color:var(--slate);border-color:var(--concrete)}
:focus-visible{outline:3px solid var(--blue);outline-offset:2px}
.row{display:grid;gap:0 12px;grid-template-columns:1fr}
@media(min-width:560px){.row.two{grid-template-columns:1fr 1fr}.row.four{grid-template-columns:1.2fr 1.2fr .8fr .8fr}}
button{font:inherit;font-weight:600;min-height:48px;padding:10px 18px;border-radius:6px;border:1.5px solid var(--slate);background:#fff;color:#000;cursor:pointer}
button.primary{background:var(--blue);border-color:var(--blue);color:#fff}
button.primary:disabled{background:var(--concrete);border-color:var(--concrete);color:var(--slate);cursor:not-allowed}
button.danger{border-color:var(--red);color:var(--red)}
button.link{border:none;background:none;min-height:40px;padding:6px 0;color:var(--blue);text-decoration:underline;font-weight:500}
.actions{display:flex;flex-wrap:wrap;gap:10px;margin:14px 0}
.panel{background:var(--tint);border-radius:8px;padding:14px 16px;margin:14px 0}
.classbox{border:1.5px solid var(--concrete);border-radius:8px;padding:6px 14px 14px;margin:12px 0}
.classbox legend{font-weight:600;padding:0 6px}
.problems{margin:6px 0 0;padding-left:20px}
.problems li{color:var(--red);margin:3px 0}
.ok{color:#000;font-weight:600}
.rec{display:flex;width:100%;justify-content:space-between;align-items:center;gap:12px;text-align:left;margin:8px 0;font-weight:500}
.rec small{color:var(--slate);display:block;font-weight:400}
.pick{border:1.5px solid var(--concrete);border-radius:8px;padding:12px 14px;margin:12px 0}
.pick .idrow{display:flex;justify-content:space-between;align-items:baseline;gap:10px;flex-wrap:wrap}
.cid{font-size:22px;font-weight:700;letter-spacing:.01em;font-variant-numeric:tabular-nums;word-break:break-all}
.pos{font-size:15px}
.pos b{font-size:22px;font-variant-numeric:tabular-nums}
.where{color:var(--slate);font-size:14px;margin:2px 0 8px}
.seg{display:flex;gap:8px;margin-top:8px}
.seg button{flex:1;min-height:44px;font-weight:500}
.seg button[aria-pressed=true]{background:var(--navy);border-color:var(--navy);color:#fff}
.kv{display:grid;grid-template-columns:max-content 1fr;gap:2px 14px;font-size:14px}
.kv dt{color:var(--slate)}.kv dd{margin:0;word-break:break-word}
.alert{border:1.5px solid var(--red);color:var(--red);border-radius:8px;padding:10px 14px;margin:12px 0;font-weight:500}
.note{border:1.5px solid var(--slate);border-radius:8px;padding:10px 14px;margin:12px 0;font-size:14px}
details{margin:26px 0;border-top:1.5px solid var(--concrete);padding-top:8px}
summary{cursor:pointer;font-weight:600;min-height:44px;display:flex;align-items:center}
.tests{list-style:none;padding:0;margin:10px 0;font-size:14px}
.tests li{padding:5px 0;border-bottom:1px solid var(--concrete)}
.pass{font-weight:700}.fail{font-weight:700;color:var(--red)}
.seg button:disabled{opacity:.7;cursor:not-allowed}
.printonly{display:none}
@media print{
  body{font-size:12px}
  .wrap{padding:0}
  button,.noprint,details,.seg,.actions{display:none!important}
  .printonly{display:block}
  .pick{break-inside:avoid;border-color:#000}
  input{border:none;border-bottom:1px solid #000;border-radius:0;min-height:0;padding:2px 0}
}
@media(prefers-reduced-motion:reduce){*{scroll-behavior:auto!important;transition:none!important}}
</style>
</head>
<body>
<div class="wrap">
  <header class="top">
    <div class="brand">THINK EQUAL &nbsp;|&nbsp; MoBSE</div>
    <h1>Pupil sampler</h1>
    <p class="sub">The Gambia RCT · ECD baseline · Works offline · Algorithm <span id="algoLabel"></span></p>
  </header>
  <noscript><p class="alert">This tool needs JavaScript. Open the file in Chrome, Firefox, Safari or Edge.</p></noscript>
  <div id="storageWarn"></div>
  <main id="app"></main>
  <p class="muted noprint" style="margin-top:36px">Build <span id="buildLabel"></span> · The Gambia RCT · MoBSE | Think Equal</p>
</div>

<script>
/* ============================ ENGINE START ============================ */
const ALGO = "GMB-PS3.0";
const M = 2147483647, A = 16807;           // Park-Miller (unchanged from the Excel sampler)
const WARMUP = 100, CANDIDATES = 4, SAMPLE_N = 10;
const CK = "0123456789ABCDEFGHIJKLMNOPQRSTUVWXYZ-";

/* v3 seed: FNV-1a hash of "algorithm|school code", then the murmur3 finaliser,
   so that neighbouring school codes (0123, 0124) give unrelated seeds. */
function seedFromCode(code){
  let h = 0x811c9dc5;
  const s = ALGO + "|" + code;
  for (let i = 0; i < s.length; i++){ h ^= s.charCodeAt(i); h = Math.imul(h, 0x01000193); }
  h ^= h >>> 16; h = Math.imul(h, 0x85ebca6b);
  h ^= h >>> 13; h = Math.imul(h, 0xc2b2ae35);
  h ^= h >>> 16;
  return ((h >>> 0) % (M - 1)) + 1;
}
/* v2 seed, used ONLY by the self-test to show this engine reproduces the Excel sampler. */
function legacySeed(code){
  let h = 20261017;
  for (const ch of code){
    const c = CK.indexOf(ch) + 1;
    const v = c <= 10 ? c + 47 : (c <= 36 ? c + 54 : 45);
    h = (h * 131 + v) % (M - 1);
  }
  return h + 1;
}
/* Returns {ok:true, picks:[{slot, cls (1-based), pos (1-based within class)}]} or {ok:false}. */
function draw(seed, counts){
  const total = counts.reduce((a, b) => a + b, 0);
  if (total < SAMPLE_N) return {ok:false, reason:"fewer than 10 eligible children"};
  let x = seed;
  for (let i = 0; i < WARMUP; i++) x = (A * x) % M;
  const remaining = Array.from({length: total}, (_, i) => i + 1);
  const ends = []; let run = 0;
  for (const c of counts){ run += c; ends.push(run); }
  const picks = [];
  for (let slot = 1; slot <= SAMPLE_N; slot++){
    const b = total - slot + 1;
    const limit = Math.floor((M - 1) / b) * b;
    let u = -1;
    for (let k = 0; k < CANDIDATES; k++){          // always consume four states
      x = (A * x) % M;
      if (u < 0 && x - 1 < limit) u = x - 1;
    }
    if (u < 0) return {ok:false, reason:"no candidate accepted"};
    const rank = 1 + (u % b);
    const pooled = remaining.splice(rank - 1, 1)[0];
    let k = 0; while (ends[k] < pooled) k++;
    picks.push({slot, cls: k + 1, pos: pooled - (ends[k] - counts[k])});
  }
  return {ok:true, picks};
}
function checkDigits(s){
  let sum = 0;
  for (let i = 0; i < s.length; i++) sum += CK.indexOf(s[i]) * (i + 1);
  return String(sum % 97).padStart(2, "0");
}
/* Child ID (format 2): school code, child number 01-10, two check digits, e.g. 0123-01-19. */
function childId(code, slot){
  const base = code + "-" + String(slot).padStart(2, "0");
  return base + "-" + checkDigits(base);
}
/* Format 1 (build r1/r2), kept so schools already sampled still open and verify. */
function childIdLegacy(code, slot){
  const base = "GMB26-S" + code + "-P" + String(slot).padStart(2, "0");
  return base + "-" + checkDigits(base);
}
function idIsValid(id){
  const t = String(id).trim().toUpperCase();
  let m = /^(.+-\d{2})-(\d{2})$/.exec(t);
  if (m && /^[A-Z0-9-]{1,20}-(0[1-9]|10)$/.test(m[1]) && checkDigits(m[1]) === m[2]) return true;
  m = /^(GMB26-S[A-Z0-9-]{1,20}-P\d{2})-(\d{2})$/.exec(t);
  return !!m && checkDigits(m[1]) === m[2];
}
function fingerprint(rec){
  const s = [ALGO, rec.code, rec.classes.map(c => c.level + ":" + c.count).join(",")].join("|");
  let h = 0x811c9dc5;
  for (let i = 0; i < s.length; i++){ h ^= s.charCodeAt(i); h = Math.imul(h, 0x01000193); }
  h ^= h >>> 16; h = Math.imul(h, 0x85ebca6b); h ^= h >>> 13; h = Math.imul(h, 0xc2b2ae35); h ^= h >>> 16;
  return (h >>> 0).toString(16).toUpperCase().padStart(8, "0");
}
/* ============================= ENGINE END ============================= */

/* ------------------------------ helpers ------------------------------ */
const $ = (s, r = document) => r.querySelector(s);
const $$ = (s, r = document) => Array.from(r.querySelectorAll(s));
const app = $("#app");
$("#algoLabel").textContent = ALGO;
const esc = s => String(s == null ? "" : s).replace(/[&<>"']/g, c => ({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));
const BUILD = "r4";
const GENDERS = ["Female", "Male"];
function emisProblem(v){
  v = String(v || "").toUpperCase();
  if (!v) return "Enter the school’s EMIS code. If it is missing, ask your supervisor before sampling.";
  if (/\s/.test(v)) return "The EMIS code cannot contain spaces.";
  if (!/^[A-Z0-9-]+$/.test(v)) return "The EMIS code can only use letters, numbers and hyphens.";
  if (v.length > 20) return "The EMIS code is longer than 20 characters.";
  return "";
}
function fmtDateTime(iso){
  const d = new Date(iso); if (isNaN(d)) return "";
  return d.toLocaleString("en-GB", {day:"numeric", month:"short", year:"numeric", hour:"2-digit", minute:"2-digit"});
}
const isDone = r => r.status === "completed";
function completionProblems(rec){
  const p = [];
  rec.picks.forEach((x, i) => {
    const miss = [];
    if (!(rec.names[i] || "").trim()) miss.push("name");
    if (!rec.gender[i]) miss.push("gender");
    if (!rec.present[i]) miss.push("attendance");
    if (miss.length) p.push("Child " + x.slot + " (" + x.id + "): " + miss.join(", "));
  });
  if (emisProblem(rec.emisIsCode ? rec.code : rec.emis)) p.push("The school’s EMIS code is missing or not valid.");
  return p;
}
const REGIONS = ["RED 3", "RED 5 North", "RED 5 South", "RED 6"];
const LEVELS = ["ECD 1", "ECD 2", "ECD 3"];
const KEY = "gmb_ps3_records_v1";
let records = [], memoryOnly = false;

function loadRecords(){
  try { records = JSON.parse(localStorage.getItem(KEY) || "[]"); }
  catch (e) { records = []; memoryOnly = true; }
  if (!Array.isArray(records)) records = [];
}
function saveRecords(){
  try { localStorage.setItem(KEY, JSON.stringify(records)); }
  catch (e) { memoryOnly = true; }
  $("#storageWarn").innerHTML = memoryOnly
    ? '<p class="alert">This browser cannot save data. Keep this page open and save the files before you close it.</p>' : "";
}
function todayISO(){
  const d = new Date(); const p = n => String(n).padStart(2, "0");
  return d.getFullYear() + "-" + p(d.getMonth() + 1) + "-" + p(d.getDate());
}
function niceDate(iso){
  const d = new Date(iso + "T00:00:00"); if (isNaN(d)) return iso;
  return d.toLocaleDateString("en-GB", {day:"numeric", month:"short", year:"numeric"});
}
function uid(){ return "r" + Date.now().toString(36) + Math.random().toString(36).slice(2, 6); }

/* ------------------------------- views ------------------------------- */
let draft = null;

function renderHome(){
  draft = null;
  const list = records.length
    ? records.map(r => {
        const n = (r.names || []).filter(x => x && x.trim()).length;
        return `<button class="rec" data-open="${esc(r.id)}"><span>${esc(r.school)} <small>${r.emisIsCode ? "EMIS " + esc(r.code) : "Code " + esc(r.code) + (r.emis ? " · EMIS " + esc(r.emis) : "")} · ${esc(niceDate(r.date))} · ${n}/10 names · <b>${isDone(r) ? "Completed" : "In progress"}</b></small></span><span aria-hidden="true">Open</span></button>`;
      }).join("")
    : `<p class="muted">No schools on this device yet. Start a new school when you are at the school with the class registers.</p>`;
  app.innerHTML = `
    <div id="installBox"></div>
    <h2 style="margin-top:0">Schools on this device</h2>
    ${list}
    <div class="actions"><button class="primary" id="newBtn">Start a new school</button></div>
    ${records.length ? `<h2>Save all schools in one file</h2>
    <div class="actions">
      <button id="exAllNames">All schools: names file (MoBSE only)</button>
      <button id="exAllCoded">All schools: coded file (no names)</button>
    </div>
    <p class="muted">One row per selected child, ${records.length} ${records.length === 1 ? "school" : "schools"} on this device. The names file lists children’s names, so keep it with MoBSE.</p>` : ""}
    <p class="note">Children’s names are kept on this device until you delete the record. Save the names file for MoBSE after every school.</p>
    <details id="rev"><summary>Reviewer tools</summary>
      <h3 style="margin-top:12px">Check a Child ID</h3>
      <p class="muted">Type an ID as it appears on an ICA or DCA form. The last two digits catch typing mistakes.</p>
      <label for="idIn">Child ID</label>
      <input id="idIn" autocomplete="off" autocapitalize="characters" placeholder="0123-01-19">
      <p id="idOut" aria-live="polite" style="margin-top:8px"></p>
      <h3 style="margin-top:22px">Self-test</h3>
      <p class="muted">Checks the sampling engine against the Excel sampler, and checks that neighbouring EMIS codes give unrelated samples. Takes a few seconds.</p>
      <div class="actions"><button id="testBtn">Run self-test</button></div>
      <ul class="tests" id="testOut" aria-live="polite"></ul>
    </details>`;
  $("#newBtn").onclick = () => { draft = newDraft(); renderSetup(); };
  if ($("#exAllNames")){ $("#exAllNames").onclick = () => exportAll(true); $("#exAllCoded").onclick = () => exportAll(false); }
  $$("[data-open]").forEach(b => b.onclick = () => renderSample(b.dataset.open));
  $("#idIn").oninput = e => {
    const v = e.target.value.trim();
    $("#idOut").innerHTML = !v ? "" : idIsValid(v)
      ? '<span class="ok">This ID is valid.</span>'
      : '<span class="fail">The check digits do not match. Look at the ID again.</span>';
  };
  $("#testBtn").onclick = runSelfTest;
  updateInstallBox();
}

function newDraft(){
  return {enumerator:"", date:todayISO(), school:"", emis:"", region:"", n:"",
          classes:Array.from({length:9}, () => ({name:"", teacher:"", level:"", count:""})), confirm:false};
}

function validateDraft(d){
  const p = [];
  const code = d.emis.toUpperCase();
  if (!d.enumerator.trim()) p.push("Enter your name.");
  if (!d.school.trim()) p.push("Enter the school name.");
  { const e = emisProblem(code); if (e) p.push(e); }
  if (code && !emisProblem(code)){
    const dup = records.find(r => r.code === code || String(r.emis || "").toUpperCase() === code);
    if (dup) p.push("EMIS code " + code + " is already on this device (" + dup.school + "). Open it from the schools list. Never sample a school twice.");
  }
  if (!REGIONS.includes(d.region)) p.push("Choose the region.");
  const dt = new Date(d.date + "T00:00:00");
  if (!d.date || isNaN(dt) || dt.getFullYear() < 2000 || dt.getFullYear() > 2099) p.push("Enter a valid visit date.");
  const n = Number(d.n);
  const nOk = d.n !== "" && Number.isInteger(n) && n >= 1 && n <= 9;
  if (d.n === "") p.push("Choose how many eligible ECD classes the school has.");
  else if (!nOk) p.push("Enter 1 to 9 classes. For more than 9, contact your supervisor.");
  let total = 0, countsOk = nOk;
  if (nOk){
    for (let i = 0; i < n; i++){
      const c = d.classes[i], lab = "Class C0" + (i + 1);
      const cnt = Number(c.count);
      if (!c.name.trim() || !c.teacher.trim() || !LEVELS.includes(c.level) || c.count === "" || !Number.isInteger(cnt) || cnt < 0){
        p.push(lab + ": enter the class name, teacher, ECD level and a whole-number count."); countsOk = false;
      } else total += cnt;
    }
    if (countsOk && total < SAMPLE_N) p.push("Stop: fewer than 10 eligible children in total. Contact your supervisor. Do not add children.");
    if (countsOk && total > 9999) p.push("The total is above 9,999. Contact your supervisor.");
  }
  return {problems:p, total:countsOk ? total : null, ready:p.length === 0};
}

function renderSetup(){
  const d = draft;
  const n = Number(d.n); const nShow = Number.isInteger(n) && n >= 1 && n <= 9 ? n : 0;
  const classes = Array.from({length:nShow}, (_, i) => {
    const c = d.classes[i];
    return `<fieldset class="classbox"><legend>Class C0${i + 1}</legend>
      <div class="row two">
        <div><label for="cn${i}">Class name</label><input id="cn${i}" data-c="${i}" data-k="name" value="${esc(c.name)}" autocomplete="off"></div>
        <div><label for="ct${i}">Teacher name</label><input id="ct${i}" data-c="${i}" data-k="teacher" value="${esc(c.teacher)}" autocomplete="off"></div>
        <div><label for="cl${i}">ECD level</label><select id="cl${i}" data-c="${i}" data-k="level"><option value="">Choose</option>${LEVELS.map(l => `<option ${c.level === l ? "selected" : ""}>${l}</option>`).join("")}</select></div>
        <div><label for="cc${i}">Eligible children, including absentees</label><input id="cc${i}" data-c="${i}" data-k="count" type="number" inputmode="numeric" min="0" step="1" value="${esc(c.count)}"></div>
      </div></fieldset>`;
  }).join("");
  app.innerHTML = `
    <p><button class="link" id="backBtn">Back to schools</button></p>
    <h2 style="margin-top:0">1. Your details</h2>
    <div class="row two">
      <div><label for="enum">Your name</label><input id="enum" data-f="enumerator" value="${esc(d.enumerator)}" autocomplete="off"></div>
      <div><label for="date">Visit date</label><input id="date" type="date" data-f="date" value="${esc(d.date)}"></div>
      <div><label for="school">School name</label><input id="school" data-f="school" value="${esc(d.school)}" autocomplete="off"></div>
      <div><label for="region">Region</label><select id="region" data-f="region"><option value="">Choose</option>${REGIONS.map(r => `<option ${d.region === r ? "selected" : ""}>${r}</option>`).join("")}</select></div>
    </div>
    <label for="emis">School EMIS code</label>
    <input id="emis" data-f="emis" value="${esc(d.emis)}" autocomplete="off" autocapitalize="characters" spellcheck="false">
    <p class="muted" style="margin-top:6px">The school’s unique EMIS ID. Copy it exactly, including leading zeros. Letters, numbers and hyphens only. This code decides which children are selected, so it is locked once you generate the sample.</p>

    <h2>2. Classes</h2>
    <p class="muted">Count every eligible child in each ECD class, including absentees. Number them 1, 2, 3 in the existing register order. List the classes in the same order every time.</p>
    <label for="ncls">How many eligible ECD classes does the school have? (1 to 9)</label>
    <input id="ncls" type="number" inputmode="numeric" min="1" max="9" step="1" data-f="n" value="${esc(d.n)}" style="max-width:140px">
    ${classes}

    <h2>3. Check and generate</h2>
    <div class="panel" id="status" aria-live="polite"></div>
    <label style="display:flex;gap:12px;align-items:flex-start;font-weight:500">
      <input type="checkbox" id="confirm" ${d.confirm ? "checked" : ""}>
      <span>All eligible classes and counts are checked, and the eligible registers are numbered.</span>
    </label>
    <p class="muted">After you generate the sample, the EMIS code, class order and counts are locked. Do not redraw. Contact your supervisor about any correction.</p>
    <div class="actions"><button class="primary" id="gen">Generate the 10 children</button></div>`;
  $("#backBtn").onclick = renderHome;
  $$("[data-f]").forEach(el => el.oninput = el.onchange = () => {
    const f = el.dataset.f;
    if (f === "emis") el.value = el.value.toUpperCase();
    draft[f] = el.value;
    if (f === "n") { renderSetup(); const x = $("#ncls"); x.focus(); } else updateStatus();
  });
  $$("[data-c]").forEach(el => el.oninput = el.onchange = () => {
    draft.classes[+el.dataset.c][el.dataset.k] = el.value; updateStatus();
  });
  $("#confirm").onchange = e => { draft.confirm = e.target.checked; updateStatus(); };
  $("#gen").onclick = generate;
  updateStatus();
}

function updateStatus(){
  const v = validateDraft(draft);
  $("#status").innerHTML = v.ready
    ? `<p class="ok" style="margin:0">Ready. Total eligible children: ${v.total}.</p>`
    : `<strong>Before you can continue</strong><ul class="problems">${v.problems.map(x => `<li>${esc(x)}</li>`).join("")}</ul>` +
      (v.total != null ? `<p class="muted" style="margin:8px 0 0">Total eligible children so far: ${v.total}.</p>` : "");
  $("#gen").disabled = !(v.ready && draft.confirm);
}

function generate(){
  const v = validateDraft(draft);
  if (!v.ready || !draft.confirm) return;
  const n = Number(draft.n);
  const code = draft.emis.toUpperCase().trim();
  const classes = draft.classes.slice(0, n).map(c => ({name:c.name.trim(), teacher:c.teacher.trim(), level:c.level, count:Number(c.count)}));
  const seed = seedFromCode(code);
  const res = draw(seed, classes.map(c => c.count));
  if (!res.ok){ alert("The draw stopped (" + res.reason + "). Contact your supervisor. Do not redraw."); return; }
  const rec = {
    id: uid(), created: new Date().toISOString(), algo: ALGO, idv: 2,
    enumerator: draft.enumerator.trim(), date: draft.date, school: draft.school.trim(), code, emis: code, emisIsCode: true, status: "in_progress", region: draft.region,
    classes, seed, total: v.total,
    picks: res.picks.map(p => ({slot:p.slot, cls:p.cls, pos:p.pos, id:childId(code, p.slot)})),
    names: Array(SAMPLE_N).fill(""), present: Array(SAMPLE_N).fill(""), gender: Array(SAMPLE_N).fill("")
  };
  records.unshift(rec); saveRecords();
  renderSample(rec.id);
}

function renderSample(id){
  const rec = records.find(r => r.id === id); if (!rec) return renderHome();
  draft = null;
  const locked = isDone(rec), dis = locked ? " disabled" : "";
  if (!Array.isArray(rec.gender)) rec.gender = Array(SAMPLE_N).fill("");
  const re = draw(seedFromCode(rec.code), rec.classes.map(c => c.count));
  const intact = re.ok && re.picks.every((p, i) => p.cls === rec.picks[i].cls && p.pos === rec.picks[i].pos && (rec.idv === 2 ? childId : childIdLegacy)(rec.code, p.slot) === rec.picks[i].id);
  const rows = rec.picks.map((p, i) => {
    const c = rec.classes[p.cls - 1];
    return `<div class="pick">
      <div class="idrow"><span class="cid">${esc(p.id)}</span><span class="pos">Register position <b>${p.pos}</b></span></div>
      <div class="where">Child ${p.slot} of 10 · C0${p.cls} ${esc(c.name)} · ${esc(c.level)} · ${esc(c.teacher)}</div>
      <label for="nm${i}" style="margin-top:4px">Child’s name (MoBSE confidential)</label>
      <input id="nm${i}" data-n="${i}" value="${esc(rec.names[i])}" autocomplete="off"${dis}>
      <div class="seg" role="group" aria-label="Gender, child ${p.slot}">
        ${GENDERS.map(g => `<button data-g="${i}" data-v="${g}" aria-pressed="${rec.gender[i] === g}"${dis}>${g}</button>`).join("")}
      </div>
      <div class="seg" role="group" aria-label="Present today? Child ${p.slot}">
        <button data-p="${i}" data-v="Yes" aria-pressed="${rec.present[i] === "Yes"}"${dis}>Present today</button>
        <button data-p="${i}" data-v="No" aria-pressed="${rec.present[i] === "No"}"${dis}>Absent today</button>
      </div></div>`;
  }).join("");
  app.innerHTML = `
    <p class="noprint"><button class="link" id="backBtn">Back to schools</button></p>
    <h2 style="margin-top:0">${esc(rec.school)}</h2>
    <dl class="kv">
      ${rec.emisIsCode
        ? `<dt>EMIS code</dt><dd>${esc(rec.code)}</dd>`
        : `<dt>School code (in IDs)</dt><dd>${esc(rec.code)}</dd><dt>EMIS code</dt><dd>${esc(rec.emis || "Not recorded")}</dd>`}
      <dt>Status</dt><dd><b>${locked ? "Completed " + esc(fmtDateTime(rec.completedAt)) : "In progress"}</b>${rec.reopened ? " · reopened " + rec.reopened + (rec.reopened === 1 ? " time" : " times") : ""}</dd>
      <dt>Region</dt><dd>${esc(rec.region)}</dd>
      <dt>Visit</dt><dd>${esc(niceDate(rec.date))} · ${esc(rec.enumerator)}</dd>
      <dt>Eligible</dt><dd>${rec.total} children in ${rec.classes.length} ${rec.classes.length === 1 ? "class" : "classes"} (${rec.classes.map((c, i) => "C0" + (i + 1) + ": " + c.count).join(", ")})</dd>
      <dt>Seed</dt><dd>${rec.seed} · ${esc(rec.algo)}</dd>
    </dl>
    ${rec.emisIsCode ? "" : `<div class="noprint">
      <label for="emisEdit">School EMIS code</label>
      <input id="emisEdit" value="${esc(rec.emis || "")}" autocomplete="off" autocapitalize="characters" spellcheck="false" style="max-width:320px"${dis}>
      <p class="muted" id="emisMsg" aria-live="polite" style="margin-top:6px">${rec.emis ? "Edit if you made a typing mistake. This does not change the sample." : "Enter the EMIS code for this school."}</p>
    </div>`}
    ${intact ? "" : `<p class="alert">This record no longer reproduces from its code and counts. Stop and contact your supervisor. Keep this file.</p>`}
    <h2>Find these 10 children</h2>
    <p class="muted">In each class, count to the register position shown, using only eligible children. Type the child’s name, choose their gender and say whether they are present. Gender is recorded after selection and does not affect who is chosen. Do not replace anyone.</p>
    <div class="panel noprint" id="prog" aria-live="polite"></div>
    ${rows}
    <div class="noprint panel" id="doneBox">
      ${locked
        ? `<p class="ok" style="margin:0 0 8px">Completed ${esc(fmtDateTime(rec.completedAt))}. This school is locked.</p>
           <p class="muted">To change a name, gender or attendance, press Edit. The change is recorded in the saved files.</p>
           <button id="editBtn">Edit this school</button>`
        : `<p style="margin:0 0 8px"><strong>Finished with this school?</strong></p>
           <p class="muted">When all 10 children have a name, gender and attendance, mark the school as completed. It then locks until you press Edit.</p>
           <button class="primary" id="doneBtn">Mark school as completed</button>
           <div id="doneMsg" aria-live="polite"></div>`}
    </div>
    <h2 class="noprint">Save this record</h2>
    <div class="actions noprint">
      <button class="primary" id="exNames">Save names file (MoBSE only)</button>
      <button id="exCoded">Save coded file (no names)</button>
      <button id="exPrint">Print or save as PDF</button>
    </div>
    <p class="note noprint">The names file lists children’s names. Keep it with MoBSE. Send Think Equal only the coded file. Copy each Child ID onto the ICA and DCA forms, including the last two digits. Use the same children and IDs at endline.</p>
    <p class="muted noprint">If a child cannot take part, record that and keep the child in the sample. Fewer than 10 eligible children, a mixed-level class, more than nine classes, or any doubt about who is eligible: stop and contact your supervisor.</p>
    <details class="noprint"><summary>Delete this record</summary>
      <p class="muted">Only delete after you have saved the names file and MoBSE has it.</p>
      <button class="danger" id="delBtn">Delete this record from the device</button>${locked ? `<p class="muted">This school is marked completed. Be sure MoBSE has the names file.</p>` : ""}
    </details>`;
  const prog = () => {
    const nn = rec.names.filter(x => x && x.trim()).length, aa = rec.present.filter(Boolean).length, gg = rec.gender.filter(Boolean).length;
    $("#prog").innerHTML = `Names entered: <b>${nn}/10</b> · Gender: <b>${gg}/10</b> · Attendance: <b>${aa}/10</b>`;
  };
  prog();
  $("#backBtn").onclick = renderHome;
  $$("[data-n]").forEach(el => el.oninput = () => { rec.names[+el.dataset.n] = el.value; saveRecords(); prog(); });
  $$("[data-p]").forEach(b => b.onclick = () => {
    const i = +b.dataset.p, v = b.dataset.v;
    rec.present[i] = rec.present[i] === v ? "" : v; saveRecords();
    $$(`[data-p="${i}"]`).forEach(x => x.setAttribute("aria-pressed", String(rec.present[i] === x.dataset.v)));
    prog();
  });
  $$("[data-g]").forEach(b => b.onclick = () => {
    const i = +b.dataset.g, v = b.dataset.v;
    rec.gender[i] = rec.gender[i] === v ? "" : v; saveRecords();
    $$(`[data-g="${i}"]`).forEach(x => x.setAttribute("aria-pressed", String(rec.gender[i] === x.dataset.v)));
    prog();
  });
  if ($("#doneBtn")) $("#doneBtn").onclick = () => {
    const probs = completionProblems(rec);
    if (probs.length){
      $("#doneMsg").innerHTML = '<p style="margin:10px 0 0"><strong>Not finished yet:</strong></p><ul class="problems">' + probs.map(x => "<li>" + esc(x) + "</li>").join("") + "</ul>";
      return;
    }
    rec.status = "completed"; rec.completedAt = new Date().toISOString();
    rec.log = (rec.log || []).concat({e:"completed", at:rec.completedAt});
    saveRecords(); renderSample(rec.id); window.scrollTo(0, 0);
  };
  if ($("#editBtn")) $("#editBtn").onclick = () => {
    if (!confirm("Reopen this completed school for editing? The change will be recorded.")) return;
    rec.status = "in_progress"; rec.reopened = (rec.reopened || 0) + 1;
    rec.log = (rec.log || []).concat({e:"reopened", at:new Date().toISOString()});
    saveRecords(); renderSample(rec.id);
  };
  if ($("#emisEdit")) $("#emisEdit").oninput = e => {
    e.target.value = e.target.value.toUpperCase();
    const prob = emisProblem(e.target.value);
    if (prob) $("#emisMsg").textContent = prob;
    else { rec.emis = e.target.value.trim(); saveRecords(); $("#emisMsg").textContent = "Saved."; }
  };
  $("#exNames").onclick = () => exportCsv(rec, true);
  $("#exCoded").onclick = () => exportCsv(rec, false);
  $("#exPrint").onclick = () => window.print();
  $("#delBtn").onclick = () => {
    if (confirm("Delete this record and the names on it? This cannot be undone.")){
      records = records.filter(r => r.id !== rec.id); saveRecords(); renderHome();
    }
  };
}

/* ------------------------------ exports ------------------------------ */
function csvCell(v){
  let s = String(v == null ? "" : v);
  if (/^[=+\-@\t\r]/.test(s)) s = "'" + s;          // stop spreadsheet formulas in typed names
  return /[",\n\r]/.test(s) ? '"' + s.replace(/"/g, '""') + '"' : s;
}
function csvFor(recs, withNames){
  const head = withNames
    ? ["EMIS code","School name","Legacy school code","Region","Visit date","Algorithm","Seed","Class order and eligible counts","Total eligible","Slot","Child ID","Class","ECD level","Register position","Gender","Present today","Class name","Teacher","Child name","Enumerator","Status","Completed on","Times reopened"]
    : ["EMIS code","Legacy school code","Region","Visit date","Algorithm","Seed","Class order and eligible counts","Total eligible","Slot","Child ID","Class","ECD level","Register position","Gender","Present today","Status","Completed on","Times reopened"];
  const lines = [head.map(csvCell).join(",")];
  recs.forEach(rec => {
    const countsStr = rec.classes.map((c, i) => "C0" + (i + 1) + "=" + c.count).join(" ");
    const gender = Array.isArray(rec.gender) ? rec.gender : [];
    const emis = rec.emisIsCode ? rec.code : (rec.emis || ""), legacy = rec.emisIsCode ? "" : rec.code;
    const tail = [isDone(rec) ? "Completed" : "In progress", isDone(rec) ? rec.completedAt : "", rec.reopened || 0];
    rec.picks.forEach((p, i) => {
      const c = rec.classes[p.cls - 1];
      const mid = [rec.region, rec.date, rec.algo, rec.seed, countsStr, rec.total, p.slot, p.id, "C0" + p.cls, c.level, p.pos, gender[i] || "", rec.present[i] || ""];
      const row = withNames
        ? [emis, rec.school, legacy].concat(mid, [c.name, c.teacher, rec.names[i] || "", rec.enumerator], tail)
        : [emis, legacy].concat(mid, tail);
      lines.push(row.map(csvCell).join(","));
    });
  });
  return "\ufeff" + lines.join("\r\n") + "\r\n";
}
function downloadText(name, text){
  const blob = new Blob([text], {type:"text/csv;charset=utf-8"});
  const a = document.createElement("a");
  a.href = URL.createObjectURL(blob); a.download = name;
  document.body.appendChild(a); a.click();
  setTimeout(() => { URL.revokeObjectURL(a.href); a.remove(); }, 1500);
}
function exportCsv(rec, withNames){
  downloadText(`GMB-PS3_${rec.code}_${rec.date}_${withNames ? "NAMES-MoBSE-ONLY" : "coded"}.csv`, csvFor([rec], withNames));
}
function exportAll(withNames){
  if (!records.length) return;
  const recs = records.slice().sort((a, b) => a.date.localeCompare(b.date) || a.code.localeCompare(b.code));
  downloadText(`GMB-PS3_ALL-${recs.length}-schools_${todayISO()}_${withNames ? "NAMES-MoBSE-ONLY" : "coded"}.csv`, csvFor(recs, withNames));
}

/* ----------------------------- self-test ----------------------------- */
const EXCEL_CASES = [
  {n:"A", code:"0123", counts:[35,28,41], exp:[[1,15],[1,23],[1,9],[2,25],[1,31],[1,24],[1,33],[3,29],[1,11],[1,5]]},
  {n:"B", code:"GM-007A", counts:[10], exp:[[1,4],[1,2],[1,3],[1,5],[1,10],[1,8],[1,7],[1,6],[1,9],[1,1]]},
  {n:"C", code:"0045", counts:[12,30,7,55,1,19], exp:[[4,14],[2,30],[4,44],[3,5],[6,6],[4,52],[4,31],[1,11],[4,27],[4,4]]},
  {n:"D", code:"GM-LOWER", counts:[6,5], exp:[[1,2],[2,5],[1,6],[1,3],[1,5],[2,4],[1,1],[2,1],[2,3],[2,2]]},
  {n:"G", code:"0124", counts:[35,28,41], exp:[[3,30],[3,10],[1,20],[3,28],[3,8],[1,22],[1,9],[2,27],[2,12],[2,24]]},
  {n:"H", code:"0123", counts:[0,20,15], exp:[[2,20],[3,9],[2,15],[2,11],[3,2],[3,8],[2,13],[3,10],[2,4],[2,16]]}
];
function corr(a, b){
  const n = a.length, ma = a.reduce((s, v) => s + v, 0) / n, mb = b.reduce((s, v) => s + v, 0) / n;
  let sab = 0, sa = 0, sb = 0;
  for (let i = 0; i < n; i++){ sab += (a[i] - ma) * (b[i] - mb); sa += (a[i] - ma) ** 2; sb += (b[i] - mb) ** 2; }
  return sab / Math.sqrt(sa * sb);
}
function runSelfTest(){
  const out = $("#testOut"); out.innerHTML = "<li>Running…</li>";
  setTimeout(() => {
    const L = [];
    const add = (ok, t) => L.push(`<li><span class="${ok ? "pass" : "fail"}">${ok ? "Pass" : "FAIL"}</span> · ${esc(t)}</li>`);
    for (const t of EXCEL_CASES){
      const r = draw(legacySeed(t.code), t.counts);
      const same = r.ok && r.picks.every((p, i) => p.cls === t.exp[i][0] && p.pos === t.exp[i][1]);
      add(same, `Engine reproduces Excel sampler, school ${t.n} (${t.code})`);
    }
    const counts = [35, 28, 41], total = 104, N = 20000;
    const hits = new Map(); let first = [], fails = 0, dupes = 0, range = 0;
    for (let i = 1; i <= N; i++){
      const code = String(i).padStart(5, "0");
      const r = draw(seedFromCode(code), counts);
      if (!r.ok){ fails++; continue; }
      const seen = new Set();
      r.picks.forEach(p => {
        const k = p.cls + ":" + p.pos; hits.set(k, (hits.get(k) || 0) + 1);
        if (seen.has(k)) dupes++; seen.add(k);
        if (p.pos < 1 || p.pos > counts[p.cls - 1]) range++;
      });
      const f = r.picks[0]; first.push(counts.slice(0, f.cls - 1).reduce((a, b) => a + b, 0) + f.pos);
    }
    const exp = N * SAMPLE_N / total; let chi = 0;
    counts.forEach((c, ci) => { for (let p = 1; p <= c; p++){ const h = hits.get((ci + 1) + ":" + p) || 0; chi += (h - exp) ** 2 / exp; } });
    const lag1 = corr(first.slice(0, -1), first.slice(1)), lag3 = corr(first.slice(0, -3), first.slice(3));
    add(fails === 0 && dupes === 0 && range === 0, `20,000 simulated schools: no failed draws, duplicates or out-of-range positions`);
    add(chi > 103 - 4 * 14.4 && chi < 103 + 4 * 14.4, `Every register position is equally likely (chi-square ${chi.toFixed(1)}, expected about 103 ± 14)`);
    add(Math.abs(lag1) < 0.03 && Math.abs(lag3) < 0.03, `Neighbouring school codes are unrelated (correlation ${lag1.toFixed(3)} and ${lag3.toFixed(3)}; the Excel seed gave 0.324 and −0.333)`);
    let nineBad = 0;
    for (let i = 1; i <= 2000; i++){
      const cs = Array.from({length:9}, (_, k) => 1 + ((i * 7 + k * 13) % 45));
      const r = draw(seedFromCode("T" + i), cs);
      if (!r.ok){ nineBad++; continue; }
      const seen = new Set(r.picks.map(p => p.cls + ":" + p.pos));
      if (seen.size !== 10 || r.picks.some(p => p.cls < 1 || p.cls > 9 || p.pos < 1 || p.pos > cs[p.cls - 1])) nineBad++;
    }
    add(nineBad === 0, "2,000 simulated schools with 9 classes: every selected position is valid and different");
    const base = "0123-01", chk = checkDigits(base);
    let caught = 0, tried = 0, swCaught = 0, swTried = 0;
    for (let i = 0; i < base.length; i++) for (const ch of CK){
      if (ch === base[i]) continue; tried++;
      if (checkDigits(base.slice(0, i) + ch + base.slice(i + 1)) !== chk) caught++;
    }
    for (let i = 0; i < base.length - 1; i++){
      if (base[i] === base[i + 1]) continue; swTried++;
      const sw = base.slice(0, i) + base[i + 1] + base[i] + base.slice(i + 2);
      if (checkDigits(sw) !== chk) swCaught++;
    }
    add(idIsValid(childId("0123", 1)) && idIsValid(childIdLegacy("0123", 1)) && !idIsValid("0123-01-00") && caught === tried && swCaught === swTried,
        `ID check digits catch every single-character typo (${caught} of ${tried}) and every swapped pair (${swCaught} of ${swTried})`);
    const ids = new Set(); let n = 0;
    for (let i = 1; i <= 2000; i++) for (let sl = 1; sl <= 10; sl++){ ids.add(childId(String(i).padStart(4, "0"), sl)); n++; }
    add(ids.size === n, `${n.toLocaleString()} child IDs across 2,000 school codes are all different`);
    out.innerHTML = L.join("");
  }, 30);
}

/* ------------------------- install and offline ------------------------ */
let installEvt = null;
const isStandalone = () => window.matchMedia("(display-mode: standalone)").matches || navigator.standalone === true;
function updateInstallBox(){
  const box = $("#installBox"); if (!box || isStandalone()) return;
  if (installEvt){
    box.innerHTML = '<div class="note"><strong>Install on this phone</strong><p style="margin:4px 0 8px">Install the app so it opens from the home screen and works without signal.</p><button class="primary" id="installBtn">Install app</button></div>';
    $("#installBtn").onclick = async () => { installEvt.prompt(); await installEvt.userChoice; installEvt = null; updateInstallBox(); };
  } else if (/iphone|ipad|ipod/i.test(navigator.userAgent)){
    box.innerHTML = '<div class="note"><strong>Install on this iPhone</strong><p style="margin:4px 0 0">Open this page in Safari, tap the Share button, then tap Add to Home Screen.</p></div>';
  } else box.innerHTML = "";
}
window.addEventListener("beforeinstallprompt", e => { e.preventDefault(); installEvt = e; updateInstallBox(); });
window.addEventListener("appinstalled", () => { installEvt = null; updateInstallBox(); });
if ("serviceWorker" in navigator && /^https?:$/.test(location.protocol)){
  window.addEventListener("load", () => navigator.serviceWorker.register("sw.js").catch(() => {}));
}

$("#buildLabel").textContent = BUILD;
